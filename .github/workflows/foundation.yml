name: Foundation checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-content:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require documentation with implementation changes
        shell: pwsh
        env:
          DOCUMENTATION_EVENT: ${{ github.event_name }}
          DOCUMENTATION_PUSH_BASE: ${{ github.event.before }}
          DOCUMENTATION_PR_BASE: ${{ github.event.pull_request.base.sha }}
          DOCUMENTATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          node Tools/check-docs.mjs --ci
          if ($LASTEXITCODE) { throw 'Documentation must be updated with implementation changes.' }
      - name: Install pinned local SDK
        shell: pwsh
        run: ./Tools/Setup-Toolchain.ps1
      - name: Validate boundaries, protocol, tables and content recovery
        shell: pwsh
        run: ./Tools/Check-Foundation.ps1
      - name: Verify protocol generation is reproducible
        shell: pwsh
        run: git diff --exit-code -- Shared/com.astraloath.shared/Runtime/Protocol
      # MySQL, Unity license and native player builds are explicit local acceptance gates.
      # This job never tracks upstream game versions or deploys a server.
